name: Temporary data reconciliation tests
on:
  push:
    branches:
      - fix/temporary-data-reconciliation-utility-v2
      - fix/reconciliation-duplicate-identity
      - fix/lt-only-data-reconciliation
    paths:
      - "functions/datareconciliationapi/**"
      - "src/pages/SettingsPage.jsx"
      - ".github/workflows/temporary-data-reconciliation-tests.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Run reconciliation safety and rollback tests
        run: node functions/datareconciliationapi/test/data-reconciliation.test.js
      - name: Install frontend dependencies
        run: npm ci
      - name: Build React application
        run: npm run build

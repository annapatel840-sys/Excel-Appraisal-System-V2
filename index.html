<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      /* Blank-page guard. Slate caches this page, so a browser can keep an old
         copy whose /assets/ files a later deploy removed; the app then never
         starts. If an /assets/ file fails to load, reload once (a reload
         always fetches the current page). At most once a minute, so no loop. */
      (function () {
        var KEY = "appraisal.assetReloadAt";
        window.addEventListener(
          "error",
          function (event) {
            var el = event && event.target;
            if (!el || (el.tagName !== "SCRIPT" && el.tagName !== "LINK")) return;
            var url = el.src || el.href || "";
            if (url.indexOf("/assets/") === -1) return;
            var last = 0;
            try {
              last = Number(window.sessionStorage.getItem(KEY)) || 0;
              if (Date.now() - last < 60000) return;
              window.sessionStorage.setItem(KEY, String(Date.now()));
            } catch (e) {
              return;
            }
            window.location.reload();
          },
          true,
        );
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <meta name="theme-color" content="#2563eb" />
    <meta
      name="description"
      content="Compensation Tool Management - compensation review and appraisal planning"
    />
    <title>Compensation Tool Management | FY 2025-26</title>
    <link rel="icon" type="image/png" href="/public/wissen_technology_logo.jpg" />
    <script src="https://static.zohocdn.com/catalyst/sdk/js/4.6.2/catalystWebSDK.js"></script>
    <script src="/__catalyst/sdk/init.js" vite-ignore></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx?v=38"></script>
  </body>
</html>
